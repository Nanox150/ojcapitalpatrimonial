name: Configurar vista previa social

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configurar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar sitio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar FFmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Crear miniatura premium para WhatsApp
        shell: bash
        run: |
          set -e
          ffmpeg -y -i assets/oj-capital-lobby-hq.avif \
            -vf "scale=1200:630:force_original_aspect_ratio=increase,crop=1200:630" \
            -q:v 2 -frames:v 1 assets/oj-capital-social-card-v3.jpg
          test -s assets/oj-capital-social-card-v3.jpg
          echo "Miniatura creada: $(stat -c%s assets/oj-capital-social-card-v3.jpg) bytes"

      - name: Actualizar metadatos de WhatsApp y redes sociales
        shell: python
        run: |
          from pathlib import Path
          import re

          archivo = Path("index.html")
          contenido = archivo.read_text(encoding="utf-8")
          nueva = "https://www.ojcapitalpatrimonial.com/assets/oj-capital-social-card-v3.jpg?v=3"

          contenido = re.sub(
              r'https://www\.ojcapitalpatrimonial\.com/assets/oj-capital-social-card(?:-v2)?\.jpg\?v=\d+',
              nueva,
              contenido
          )

          contenido = re.sub(
              r'<meta property="og:image:type" content="[^"]+"\s*/?>',
              '<meta property="og:image:type" content="image/jpeg" />',
              contenido
          )
          contenido = re.sub(
              r'<meta property="og:image:width" content="[^"]+"\s*/?>',
              '<meta property="og:image:width" content="1200" />',
              contenido
          )
          contenido = re.sub(
              r'<meta property="og:image:height" content="[^"]+"\s*/?>',
              '<meta property="og:image:height" content="630" />',
              contenido
          )
          contenido = re.sub(
              r'<meta\s+property="og:image:alt"\s+content="[^"]*"\s*/?>',
              '<meta property="og:image:alt" content="Lobby de OJ Capital Patrimonial" />',
              contenido
          )
          contenido = re.sub(
              r'<meta\s+name="twitter:image:alt"\s+content="[^"]*"\s*/?>',
              '<meta name="twitter:image:alt" content="Lobby de OJ Capital Patrimonial" />',
              contenido
          )

          archivo.write_text(contenido, encoding="utf-8")

      - name: Eliminar miniaturas anteriores
        shell: bash
        run: |
          rm -f assets/oj-capital-social-card.jpg assets/oj-capital-social-card-v2.jpg

      - name: Publicar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git commit -m "Actualiza miniatura de WhatsApp con lobby OJ Capital"
          git push origin main
